name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      # go-tree-sitter uses CGO. The Windows runner needs a native compiler
      # explicitly installed; Linux and macOS runners provide one.
      - name: Set up Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Test
        if: runner.os != 'Windows'
        run: go test ./...

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go test ./...

      - name: Build
        if: runner.os != 'Windows'
        run: go build ./cmd/code-scale-mcp

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go build ./cmd/code-scale-mcp
